version: "3.9"
name: chat2anything-migration

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chat2anything_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat2anything
    ports:
      - "5432:5432"
    volumes:
      - chat2anything_pg_data:/var/lib/postgresql/data

  migration_api:
    image: python:3.11-slim
    container_name: chat2anything_migration_api
    working_dir: /app
    command: >
      sh -c "pip install -r api/requirements-modern.txt &&
             uvicorn app.main:app --app-dir /app/api --host 0.0.0.0 --port 8100"
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/chat2anything
    volumes:
      - ../:/app
    depends_on:
      - postgres
    ports:
      - "8100:8100"

volumes:
  chat2anything_pg_data:
